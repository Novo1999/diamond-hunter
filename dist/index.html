<title>Diamond Hunter</title>

<style>
/* Layout: one centred column; a carved-stone frame holds the game screen, with the HUD on its lintel and controls below. */
:root {
  --night: #0c1410;
  --panel: #142019;
  --stone: #2b3a30;
  --stone-hi: #3d5143;
  --line: #2f4136;
  --ink: #ede5cd;
  --muted: #9eab97;
  --gold: #e8b84a;
  --gold-ink: #241805;
  --gold-hi: #fff0a8;
  --gem: #6fdcec;
  --ruby: #ef5a6c;
  --danger: #ef7a5a;
  --font-display: "Jersey 10", "Courier New", monospace;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.75rem;
  --step-3: 2.75rem;
  --step-4: 4.25rem;
  color-scheme: dark;
}
html, body { height: 100%; }
/* Overlays and toasts are toggled with the hidden attribute; keep it stronger than their display rules */
[hidden] { display: none !important; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #15241b 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 780px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 18px 28px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
}
.top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.brand {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--step-2);
  letter-spacing: 0.06em;
  line-height: 1;
  color: var(--gold);
  text-transform: uppercase;
}
.brand span { color: var(--gem); }
.top-actions { display: flex; gap: 8px; }

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.chip {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: var(--step--1);
  color: var(--muted);
}
.chip:hover { color: var(--ink); border-color: var(--stone-hi); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Stone frame */
.frame {
  min-width: 0;
  background: var(--stone);
  border-radius: 10px;
  padding: 0 10px 10px;
  box-shadow: inset 0 2px 0 var(--stone-hi), inset 0 -3px 0 #1b261f, 0 18px 40px rgba(0, 0, 0, 0.45);
}
.hud {
  display: flex;
  align-items: center;
  gap: 6px 18px;
  flex-wrap: wrap;
  padding: 8px 4px;
  font-family: var(--font-display);
  font-size: var(--step-1);
  line-height: 1;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}
.hud .stat { display: inline-flex; align-items: center; gap: 6px; }
.hud img { width: 20px; height: 20px; image-rendering: pixelated; }
.hud .label { color: var(--muted); font-size: var(--step-0); text-transform: uppercase; letter-spacing: 0.08em; }
.hud .lvl { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: var(--step-0); }
.hud .ok { color: var(--gold); }
.hud .dim { opacity: 0.35; }

.screen {
  position: relative;
  border-radius: 4px;
  overflow: hidden;
  background: #050806;
  box-shadow: 0 0 0 2px #121a14, 0 0 0 4px #4a5d4e;
}
canvas#view {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 240 / 176;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* Overlays drawn over the game screen */
.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 14px;
  background: rgba(6, 10, 8, 0.66);
  overflow: auto;
}
.overlay.clear { background: linear-gradient(180deg, rgba(6,10,8,0.2), rgba(6,10,8,0.75)); }
.card {
  width: min(100%, 440px);
  display: grid;
  gap: 12px;
  text-align: center;
  justify-items: center;
}
.eyebrow {
  font-size: var(--step--1);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--gem);
  margin: 0;
}
.card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: var(--step-3);
  line-height: 0.95;
  letter-spacing: 0.03em;
  text-wrap: balance;
}
.card h2.title {
  font-size: clamp(3rem, 12vw, 5.5rem);
  color: var(--gold);
  text-transform: uppercase;
  text-shadow: 0 4px 0 #6b4a12, 0 8px 18px rgba(0,0,0,0.6);
}
.card p { margin: 0; color: var(--ink); max-width: 36ch; text-wrap: pretty; }
.card .sub { color: var(--muted); font-size: var(--step--1); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn {
  border-radius: 6px;
  padding: 9px 18px;
  border: 1px solid var(--stone-hi);
  background: var(--panel);
  font-weight: 700;
}
.btn:hover { border-color: var(--gold); }
.btn.primary {
  background: var(--gold);
  color: var(--gold-ink);
  border-color: var(--gold);
  box-shadow: 0 3px 0 #8a6418;
}
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a6418; }

.stats {
  display: grid;
  grid-template-columns: auto auto;
  gap: 4px 22px;
  margin: 0;
  font-variant-numeric: tabular-nums;
}
.stats dt { color: var(--muted); text-align: left; }
.stats dd { margin: 0; text-align: right; font-weight: 700; }
.tag { color: var(--gold); font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.1em; }

.levels {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  width: min(100%, 560px);
}
.lv {
  display: grid;
  gap: 2px;
  text-align: left;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: rgba(20, 32, 25, 0.92);
  min-width: 0;
}
.lv:hover:not(:disabled) { border-color: var(--gold); }
.lv:disabled { cursor: not-allowed; opacity: 0.45; }
.lv .n { font-family: var(--font-display); font-size: var(--step-2); line-height: 1; color: var(--gold); }
.lv .nm { font-size: var(--step--1); font-weight: 700; overflow-wrap: anywhere; }
.lv .st { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; }
.lv .st img { width: 12px; height: 12px; image-rendering: pixelated; }

.toast {
  position: absolute;
  left: 50%;
  top: 10px;
  transform: translateX(-50%);
  background: rgba(10, 18, 14, 0.9);
  border: 1px solid var(--gem);
  color: var(--gem);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: var(--step--1);
  pointer-events: none;
  transition: opacity 0.3s;
}

/* Touch controls */
.pad {
  display: none;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(3, 58px);
  gap: 4px;
}
.dpad button, .side button {
  border-radius: 10px;
  border: 1px solid var(--stone-hi);
  background: var(--stone);
  box-shadow: inset 0 2px 0 var(--stone-hi), 0 3px 0 #111a14;
  touch-action: none;
  display: grid;
  place-items: center;
}
.dpad button.on { background: var(--gold); box-shadow: inset 0 2px 0 var(--gold-hi); }
.dpad svg { width: 22px; height: 22px; fill: var(--ink); }
.dpad button.on svg { fill: var(--gold-ink); }
.dpad .u { grid-area: 1 / 2; } .dpad .l { grid-area: 2 / 1; } .dpad .r { grid-area: 2 / 3; } .dpad .d { grid-area: 3 / 2; }
.side { display: grid; gap: 8px; justify-self: end; }
.side button { padding: 10px 16px; font-size: var(--step--1); font-weight: 700; color: var(--muted); }
@media (hover: none), (pointer: coarse) {
  .pad { display: grid; }
  .keys { display: none; }
}
.app.touch .pad { display: grid; }

.keys {
  margin: 0;
  color: var(--muted);
  font-size: var(--step--1);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 18px;
}
kbd {
  font-family: var(--font-body);
  font-size: 0.75rem;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 5px;
  color: var(--ink);
  background: var(--panel);
}

@media (max-width: 560px) {
  .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hud { font-size: var(--step-0); gap: 4px 12px; }
  .hud .label { display: none; }
  .hud img { width: 16px; height: 16px; }
  .card h2 { font-size: var(--step-2); }
  .card p { font-size: var(--step--1); }
  .overlay { padding: 8px; }
  .card { gap: 8px; }
  .btn { padding: 7px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { transition: none; }
}
</style>

<body>
<div class="app" id="app">
  <header class="top">
    <h1 class="brand">Diamond <span>Hunter</span></h1>
    <div class="top-actions">
      <button class="chip" id="levelsBtn" type="button">Levels</button>
      <button class="chip" id="muteBtn" type="button" aria-pressed="false">Sound: on</button>
    </div>
  </header>

  <section class="frame" aria-label="Game">
    <div class="hud" id="hud" aria-live="off">
      <span class="stat"><img id="icGem" alt="Gems"><span id="hGems">0/0</span></span>
      <span class="stat"><img id="icKey" alt="Keys"><span id="hKeys">0</span></span>
      <span class="stat"><img id="icRuby" alt="Ruby"><span id="hRuby">0/0</span></span>
      <span class="stat"><span class="label">Time</span><span id="hTime">0:00</span></span>
      <span class="stat"><span class="label">Deaths</span><span id="hDeaths">0</span></span>
      <span class="lvl" id="hLevel"></span>
    </div>
    <div class="screen">
      <canvas id="view" width="240" height="176"></canvas>
      <div class="overlay" id="overlay"></div>
      <div class="toast" id="toast" hidden></div>
      <audio id="bgm" src="bg-music.mp3" loop preload="auto" aria-hidden="true"></audio>
    </div>
  </section>

  <div class="pad" id="pad">
    <div class="dpad">
      <button class="u" type="button" data-dir="U" aria-label="Up"><svg viewBox="0 0 10 10"><path d="M5 1 9 8H1z"/></svg></button>
      <button class="l" type="button" data-dir="L" aria-label="Left"><svg viewBox="0 0 10 10"><path d="M1 5 8 1v8z"/></svg></button>
      <button class="r" type="button" data-dir="R" aria-label="Right"><svg viewBox="0 0 10 10"><path d="M9 5 2 9V1z"/></svg></button>
      <button class="d" type="button" data-dir="D" aria-label="Down"><svg viewBox="0 0 10 10"><path d="M5 9 1 2h8z"/></svg></button>
    </div>
    <div></div>
    <div class="side">
      <button type="button" id="padPause">Pause</button>
      <button type="button" id="padRetry">Retry</button>
    </div>
  </div>

  <p class="keys">
    <span><kbd>Arrows</kbd> / <kbd>WASD</kbd> move</span>
    <span><kbd>R</kbd> back to checkpoint</span>
    <span><kbd>P</kbd> / <kbd>Esc</kbd> pause</span>
    <span><kbd>M</kbd> sound</span>
  </p>
</div>

<script>
// Game rules. Pure logic with no DOM access, so the test solver can run it in Node.
(function (root) {
  'use strict';

  const T = { EMPTY: 0, WALL: 1, DIRT: 2, BOULDER: 3, GEM: 4, RED: 5, KEY: 6, DOOR: 7, EXIT: 8, PLAYER: 9, BAT: 10, SPIDER: 11 };
  const OV = { NONE: 0, SPIKE: 1, CHECK: 2 };
  const SPIKE_PERIOD = 16;
  const SPIKE_UP = 6;
  const TICK_MS = 135;
  // Standing still under a resting boulder for this long crushes the explorer (about 3 seconds)
  const HOLD_TICKS = Math.round(3000 / TICK_MS);
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };

  // Map legend:
  //  #  wall          .  soil (dig through)   O  boulder
  //  *  gem           R  ruby (bonus)         k  key        D  locked door
  //  E  exit          P  player start         C  checkpoint
  //  b/B bat flying right/left                s/S spider crawling down/up
  //  ^  spikes (phase A)                      ;  spikes (phase B, half a cycle later)
  const LEGEND = {
    ' ': [T.EMPTY], '#': [T.WALL], '.': [T.DIRT], 'O': [T.BOULDER], '*': [T.GEM], 'R': [T.RED],
    'k': [T.KEY], 'D': [T.DOOR], 'E': [T.EXIT], 'P': [T.PLAYER],
    'b': [T.BAT, 1], 'B': [T.BAT, -1], 's': [T.SPIDER, 1], 'S': [T.SPIDER, -1],
    '^': [T.EMPTY, 0, OV.SPIKE, 0], ';': [T.EMPTY, 0, OV.SPIKE, SPIKE_PERIOD / 2], 'C': [T.EMPTY, 0, OV.CHECK],
  };

  function isRound(c) { return c === T.BOULDER || c === T.GEM || c === T.RED; }
  function isEnemy(c) { return c === T.BAT || c === T.SPIDER; }

  function parse(level) {
    const rows = level.map;
    const h = rows.length;
    const w = Math.max(...rows.map((r) => r.length));
    const n = w * h;
    const s = {
      w, h,
      t: new Uint8Array(n),   // tile type
      f: new Uint8Array(n),   // 1 while a boulder is falling
      d: new Int8Array(n),    // enemy heading
      ov: new Uint8Array(n),  // floor overlay: spikes or checkpoint
      sp: new Uint8Array(n),  // spike phase offset
      mv: new Int32Array(n).fill(-1), // where each cell's content came from this tick (for animation)
      moved: new Uint8Array(n),
      cp: new Uint8Array(n),  // checkpoints already touched
      px: 0, py: 0, face: 1,
      gems: 0, red: 0, keys: 0,
      need: level.need, totalGems: 0, totalRed: 0,
      tick: 0, alive: true, won: false, cause: '',
      hold: 0,                // ticks spent standing still under a boulder
      events: [],
    };
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const ch = rows[y][x] === undefined ? '#' : rows[y][x];
        const def = LEGEND[ch];
        if (!def) throw new Error(`Unknown map char "${ch}" at ${x},${y} in ${level.name}`);
        const i = y * w + x;
        s.t[i] = def[0];
        if (def[1]) s.d[i] = def[1];
        if (def[2]) { s.ov[i] = def[2]; s.sp[i] = def[3] || 0; }
        if (def[0] === T.PLAYER) { s.px = x; s.py = y; }
        if (def[0] === T.GEM || isEnemy(def[0])) s.totalGems++;
        if (def[0] === T.RED) s.totalRed++;
      }
    }
    return s;
  }

  function clone(s) {
    const c = Object.assign({}, s);
    for (const k of ['t', 'f', 'd', 'ov', 'sp', 'mv', 'moved', 'cp']) c[k] = s[k].slice();
    c.events = [];
    return c;
  }

  function spikePhase(s, i) { return (s.tick + s.sp[i]) % SPIKE_PERIOD; }
  function spikeUp(s, i) { return spikePhase(s, i) < SPIKE_UP; }
  function spikeWarn(s, i) { return spikePhase(s, i) >= SPIKE_PERIOD - 3; }

  function die(s, cause) {
    s.alive = false;
    s.cause = cause;
    s.events.push('die');
  }

  function move(s, from, to) {
    s.t[to] = s.t[from];
    s.d[to] = s.d[from];
    s.t[from] = T.EMPTY;
    s.f[from] = 0;
    s.d[from] = 0;
    s.mv[to] = from;
    s.moved[to] = 1;
  }

  // Advance the world one tick. dir is 'U', 'D', 'L', 'R' or null.
  function step(s, dir) {
    if (!s.alive || s.won) return;
    s.tick++;
    s.events.length = 0;
    s.mv.fill(-1);
    s.moved.fill(0);
    const W = s.w, t = s.t;

    // 1. Player
    if (dir) {
      const [dx, dy] = DIRS[dir];
      if (dx) s.face = dx;
      const pi = s.py * W + s.px;
      const ni = pi + dy * W + dx;
      const c = t[ni];
      let go = false;
      switch (c) {
        case T.EMPTY: go = true; break;
        case T.DIRT: go = true; s.events.push('dig'); break;
        case T.GEM: go = true; s.gems++; s.events.push('gem'); break;
        case T.RED: go = true; s.red++; s.events.push('red'); break;
        case T.KEY: go = true; s.keys++; s.events.push('key'); break;
        case T.DOOR:
          if (s.keys > 0) { s.keys--; go = true; s.events.push('door'); }
          else s.events.push('bump');
          break;
        case T.EXIT:
          if (s.gems >= s.need) { go = true; s.won = true; s.events.push('win'); }
          else s.events.push('bump');
          break;
        case T.BOULDER:
          if (dy === 0 && !s.f[ni] && t[ni + dx] === T.EMPTY) {
            move(s, ni, ni + dx);
            go = true;
            s.events.push('push');
          }
          break;
        case T.BAT: case T.SPIDER:
          t[pi] = T.EMPTY;
          s.mv[ni] = pi;
          s.px += dx; s.py += dy;
          die(s, 'enemy');
          return;
      }
      if (go) {
        s.hold = 0;
        t[pi] = T.EMPTY;
        t[ni] = T.PLAYER;
        s.mv[ni] = pi;
        s.moved[ni] = 1;
        s.px += dx; s.py += dy;
        if (s.won) return;
        if (s.ov[ni] === OV.CHECK && !s.cp[ni]) { s.cp[ni] = 1; s.events.push('check'); }
      }
    }

    // 2. Boulders and enemies, scanned bottom-up so stacks fall together. Gems stay where they are.
    const enemyTurn = s.tick % 2 === 0;
    for (let y = s.h - 2; y >= 1; y--) {
      for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        if (s.moved[i]) continue;
        const c = t[i];
        if (c === T.BOULDER) {
          const b = i + W, cb = t[b];
          if (cb === T.EMPTY) {
            move(s, i, b);
            s.f[b] = 1;
          } else if (cb === T.PLAYER && s.f[i]) {
            die(s, 'crush');
            return;
          } else if (isEnemy(cb)) {
            // A boulder landing on a creature turns it into a gem
            t[b] = T.GEM; s.d[b] = 0; s.f[b] = 0; s.moved[b] = 1;
            s.f[i] = 0;
            s.events.push('squash');
          } else if (isRound(cb) && !s.f[b]) {
            // Boulders roll off gems and other boulders when there is room to the side
            if (t[i - 1] === T.EMPTY && t[i - 1 + W] === T.EMPTY) { move(s, i, i - 1); s.f[i - 1] = 1; }
            else if (t[i + 1] === T.EMPTY && t[i + 1 + W] === T.EMPTY) { move(s, i, i + 1); s.f[i + 1] = 1; }
            else { if (s.f[i]) s.events.push('land'); s.f[i] = 0; }
          } else {
            if (s.f[i]) s.events.push('land');
            s.f[i] = 0;
          }
        } else if (isEnemy(c) && enemyTurn) {
          const n = c === T.BAT ? i + s.d[i] : i + s.d[i] * W;
          if (t[n] === T.PLAYER) { die(s, 'enemy'); return; }
          if (t[n] === T.EMPTY) move(s, i, n);
          else s.d[i] = -s.d[i];
        }
      }
    }

    // 3. Spikes
    const pi = s.py * W + s.px;
    if (s.ov[pi] === OV.SPIKE && spikeUp(s, pi)) { die(s, 'spike'); return; }

    // 4. A boulder resting on the explorer's head gets too heavy to hold

    out.spike = { down: spikeTile('down'), warn: spikeTile('warn'), up: spikeTile('up') };
    out.check = [checkpointTile(false), checkpointTile(true)];
    return out;
  }

  root.Sprites = { S, build, PAL };
})(this);

</script>
<script>
// Game loop, rendering, input, sound and menus.
(function () {
  'use strict';

  const { T, OV } = Engine;
  const TS = Sprites.S;
  const VW = 15, VH = 11;
  const TICK = Engine.TICK_MS;
  const SAVE_KEY = 'diamondhunter.v1';
  const OLD_SAVE_KEY = 'gemhunter.v1'; // the game's earlier name; progress carries over
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = (id) => document.getElementById(id);
  const canvas = $('view');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const overlay = $('overlay');
  const SPR = Sprites.build();

  // ---------- Saved progress ----------
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY) || localStorage.getItem(OLD_SAVE_KEY);
      if (raw) return Object.assign({ unlocked: 1, best: {}, muted: false }, JSON.parse(raw));
    } catch (e) { /* storage unavailable */ }
    return { unlocked: 1, best: {}, muted: false };
  }
  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage unavailable */ }
  }
  const save = loadSave();

  // ---------- Sound (square-wave bleeps in the spirit of old handsets) ----------
  let ac = null;
  let muted = !!save.muted;
  function audio() {
    if (muted) return null;
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, opts = {}) {
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime + (opts.at || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = opts.type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (opts.to) o.frequency.exponentialRampToValueAtTime(opts.to, t0 + dur);
    g.gain.setValueAtTime(opts.vol || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, at = 0) {
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime + at;
    const n = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, n, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900;
    src.buffer = buf; g.gain.value = vol;
    src.connect(f).connect(g).connect(a.destination);
    src.start(t0);
  }
  const SFX = {
    gem() { tone(1318, 0.05); tone(1976, 0.09, { at: 0.05, vol: 0.04 }); },
    red() { [1046, 1318, 1568, 2093].forEach((f, i) => tone(f, 0.08, { at: i * 0.06, vol: 0.045 })); },
    key() { tone(880, 0.06); tone(1175, 0.06, { at: 0.07 }); tone(1760, 0.1, { at: 0.14, vol: 0.04 }); },
    door() { tone(220, 0.12, { to: 330 }); noise(0.12, 0.12); },
    push() { noise(0.08, 0.18); },
    land() { noise(0.12, 0.3); tone(90, 0.1, { type: 'triangle', vol: 0.12, to: 50 }); },
    dig() { noise(0.035, 0.08); },
    squash() { tone(600, 0.12, { to: 120, type: 'sawtooth', vol: 0.05 }); tone(1568, 0.1, { at: 0.12, vol: 0.04 }); },
    bump() { tone(140, 0.07, { vol: 0.04 }); },
    strain() { tone(110, 0.18, { type: 'sawtooth', vol: 0.05, to: 80 }); noise(0.1, 0.12); },
    check() { [784, 1046, 1318].forEach((f, i) => tone(f, 0.12, { at: i * 0.08, type: 'triangle', vol: 0.07 })); },
    die() { tone(660, 0.5, { to: 80, vol: 0.06 }); noise(0.3, 0.2); },
    win() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, i === 5 ? 0.3 : 0.1, { at: i * 0.1, vol: 0.05 })); },
  };

  // ---------- Game state ----------
  let mode = 'title';          // title | select | intro | play | pause | dead | won | done
  let li = 0;                  // level index
  let st = null;               // engine state
  let checkpoint = null;       // engine state snapshot at the last checkpoint
  let run = { time: 0, deaths: 0 };
  let acc = 0;
  let lastFrame = 0;
  let deathAt = 0;
  let shake = 0;
  let particles = [];
  const held = [];
  let queued = null;
  let cam = { x: 0, y: 0, init: false };

  function startLevel(i, showIntro = true) {
    li = i;
    st = Engine.parse(LEVELS[li]);
    checkpoint = null;
    run = { time: 0, deaths: 0 };
    particles = [];
    held.length = 0; queued = null;
    acc = 0;
    cam.init = false;
    if (showIntro) showIntroCard(); else setMode('play');
    updateHud(true);
  }

  function respawn() {
    st = checkpoint ? Engine.clone(checkpoint) : Engine.parse(LEVELS[li]);
    particles = [];
    held.length = 0; queued = null;
    acc = 0;
    cam.init = false;
    setMode('play');
    clearOverlay();
  }

  function setMode(m) {
    mode = m;
    $('padPause').textContent = m === 'pause' ? 'Resume' : 'Pause';
    syncMusic();
  }

  // ---------- Background music ----------
  // Plays at half volume while a level is being played; pauses on menus, pause, death and win.
  // Keeps its position between levels. Respects the sound toggle. Missing file fails quietly.
  const MUSIC_VOLUME = 0.5;
  const bgm = $('bgm');
  bgm.volume = MUSIC_VOLUME;
  function syncMusic() {
    const want = mode === 'play' && !muted;
    if (want) {
      if (bgm.paused) { const p = bgm.play(); if (p && p.catch) p.catch(() => { /* autoplay blocked or file missing */ }); }
    } else if (!bgm.paused) {
      bgm.pause();
    }
  }

  // ---------- Attract mode behind the title screen ----------
  function startAttract() {
    li = 3;
    st = Engine.parse(LEVELS[li]);
    cam.init = false;
    particles = [];
  }

  // ---------- Input ----------
  const KEYMAP = {
    ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R',
    KeyW: 'U', KeyS: 'D', KeyA: 'L', KeyD: 'R',
  };
  function press(dir) {
    audio();
    if (mode === 'intro') { clearOverlay(); setMode('play'); }
    if (mode !== 'play') return;
    const i = held.indexOf(dir);
    if (i >= 0) held.splice(i, 1);
    held.push(dir);
    queued = dir;
  }
  function release(dir) {
    const i = held.indexOf(dir);
    if (i >= 0) held.splice(i, 1);
  }

  window.addEventListener('keydown', (e) => {
    const dir = KEYMAP[e.code];
    if (dir) {
      // Arrow keys move the explorer; let them drive menu focus only when a card is up
      if (mode === 'play' || mode === 'intro') { e.preventDefault(); if (!e.repeat) press(dir); }
      return;
    }
    if (e.code === 'Space' && (mode === 'play' || mode === 'intro')) e.preventDefault();
    if (e.code === 'KeyM') toggleMute();
    else if (e.code === 'KeyP' || e.code === 'Escape') {
      if (mode === 'play') pauseGame();
      else if (mode === 'pause') resumeGame();
    } else if (e.code === 'KeyR' && (mode === 'play' || mode === 'pause' || mode === 'dead')) {
      respawn();
    }
  });
  window.addEventListener('keyup', (e) => { const dir = KEYMAP[e.code]; if (dir) release(dir); });
  window.addEventListener('blur', () => { held.length = 0; if (mode === 'play') pauseGame(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') pauseGame(); });

  document.querySelectorAll('.dpad button').forEach((b) => {
    const dir = b.dataset.dir;
    const down = (e) => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); b.classList.add('on'); press(dir); };
    const up = () => { b.classList.remove('on'); release(dir); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  });
  $('padPause').addEventListener('click', () => { if (mode === 'play') pauseGame(); else if (mode === 'pause') resumeGame(); });
  $('padRetry').addEventListener('click', () => { if (mode === 'play' || mode === 'pause' || mode === 'dead') respawn(); });
  $('levelsBtn').addEventListener('click', () => { if (mode === 'play') setMode('pause'); showSelect(); });
  $('muteBtn').addEventListener('click', toggleMute);
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches) $('app').classList.add('touch');

  function toggleMute() {
    muted = !muted;
    save.muted = muted;
    writeSave();
    $('muteBtn').textContent = muted ? 'Sound: off' : 'Sound: on';
    $('muteBtn').setAttribute('aria-pressed', String(muted));
    syncMusic();
    if (!muted) SFX.gem();
  }
  $('muteBtn').textContent = muted ? 'Sound: off' : 'Sound: on';

  // ---------- Overlays ----------
  function iconURL(sprite) {
    const c = document.createElement('canvas');
    c.width = TS; c.height = TS;
    c.getContext('2d').drawImage(sprite, 0, 0);
    return c.toDataURL();
  }
  const ICON = { gem: iconURL(SPR.gem[0]), key: iconURL(SPR.key[0]), ruby: iconURL(SPR.ruby[0]) };
  $('icGem').src = ICON.gem; $('icKey').src = ICON.key; $('icRuby').src = ICON.ruby;

  function card(html, cls = '') {
    overlay.className = 'overlay ' + cls;
    overlay.hidden = false;
    overlay.innerHTML = `<div class="card">${html}</div>`;
    const first = overlay.querySelector('[data-primary]') || overlay.querySelector('button:not(:disabled)');
    if (first) first.focus({ preventScroll: true });
  }
  function clearOverlay() { overlay.hidden = true; overlay.innerHTML = ''; }
  function on(id, fn) { const el = overlay.querySelector('#' + id); if (el) el.addEventListener('click', fn); }

  const fmt = (ms) => {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };

  function showTitle() {
    setMode('title');
    startAttract();
    const next = Math.min(save.unlocked, LEVELS.length) - 1;
    const fresh = !Object.keys(save.best).length;
    card(`
      <p class="eyebrow">A temple full of gems and falling stone</p>
      <h2 class="title">Diamond Hunter</h2>
      <p>Dig through the jungle temple, collect gems, and get out before the boulders get you.</p>
      <div class="btns">
        <button class="btn primary" id="cPlay" data-primary type="button">${fresh ? 'Start adventure' : `Continue: level ${next + 1}`}</button>
        <button class="btn" id="cSel" type="button">Choose level</button>
      </div>
      <p class="sub">${LEVELS.length} levels. Find the hidden ruby in each one.</p>`, 'clear');
    on('cPlay', () => startLevel(next));
    on('cSel', showSelect);
  }

  function showSelect() {
    if (mode !== 'pause') setMode('select');
    if (!st) startAttract();
    const items = LEVELS.map((lv, i) => {
      const b = save.best[i];
      const locked = i + 1 > save.unlocked;
      const status = locked ? 'Locked'
        : b ? `${fmt(b.time)}${b.ruby ? ` <img src="${ICON.ruby}" alt="Ruby found">` : ''}`
        : 'Not cleared';
      return `<button class="lv" type="button" data-lv="${i}" ${locked ? 'disabled' : ''}>
        <span class="n">${i + 1}</span><span class="nm">${lv.name}</span><span class="st">${status}</span></button>`;
    }).join('');
    const back = mode === 'pause' ? 'Back to game' : 'Back';
    card(`<p class="eyebrow">Choose a level</p>
      <div class="levels">${items}</div>
      <div class="btns"><button class="btn" id="cBack" type="button">${back}</button></div>
      <p class="sub">Clear a level to unlock the next one.</p>`);
    overlay.querySelectorAll('[data-lv]').forEach((b) => b.addEventListener('click', () => startLevel(Number(b.dataset.lv))));
    const firstOpen = overlay.querySelector(`[data-lv="${Math.min(save.unlocked, LEVELS.length) - 1}"]`);
    if (firstOpen) firstOpen.focus({ preventScroll: true });
    on('cBack', () => { if (mode === 'pause') showPause(); else showTitle(); });
  }

  function showIntroCard() {
    setMode('intro');
    const lv = LEVELS[li];
    card(`<p class="eyebrow">Level ${li + 1} of ${LEVELS.length}</p>
      <h2>${lv.name}</h2>
      <p>${lv.hint}</p>
      <p class="sub">Collect ${lv.need} gems to open the exit.</p>
      <div class="btns"><button class="btn primary" id="cGo" data-primary type="button">Start</button></div>
      <p class="sub">Or press any arrow key.</p>`, 'clear');
    on('cGo', () => { audio(); clearOverlay(); setMode('play'); });
  }

  function pauseGame() {
    setMode('pause');
    held.length = 0;
    showPause();
  }
  function showPause() {
    card(`<p class="eyebrow">Paused</p><h2>${LEVELS[li].name}</h2>
      <div class="btns">
        <button class="btn primary" id="cRes" data-primary type="button">Resume</button>
        <button class="btn" id="cCp" type="button">${checkpoint ? 'Back to checkpoint' : 'Restart level'}</button>
        ${checkpoint ? '<button class="btn" id="cRst" type="button">Restart level</button>' : ''}
        <button class="btn" id="cSel" type="button">Levels</button>
      </div>
      <p class="sub">Stuck behind a boulder? Go back to your last checkpoint.</p>`);
    on('cRes', resumeGame);
    on('cCp', respawn);
    on('cRst', () => startLevel(li, false));
    on('cSel', showSelect);
  }
  function resumeGame() { clearOverlay(); setMode('play'); lastFrame = performance.now(); }

  const CAUSE = {
    crush: 'A boulder came down on you.',
    enemy: 'A temple creature caught you.',
    spike: 'The spikes caught you.',
    held: 'You held the boulder too long and it crushed you.',
  };
  function showDead() {
    card(`<p class="eyebrow">You died</p><h2>${CAUSE[st.cause] || 'Ouch.'}</h2>
      <div class="btns">
        <button class="btn primary" id="cCp" data-primary type="button">${checkpoint ? 'Back to checkpoint' : 'Try again'}</button>
        ${checkpoint ? '<button class="btn" id="cRst" type="button">Restart level</button>' : ''}
      </div>
      <p class="sub">Press R to try again.</p>`);
    on('cCp', respawn);
    on('cRst', () => startLevel(li, false));
  }

  function completeLevel() {
    setMode('won');
    const prev = save.best[li];
    const ruby = st.red >= st.totalRed && st.totalRed > 0;
    const newBest = !prev || run.time < prev.time;
    save.best[li] = {
      time: newBest ? run.time : prev.time,
      ruby: ruby || (prev && prev.ruby) || false,
      deaths: prev ? Math.min(prev.deaths, run.deaths) : run.deaths,
    };
    save.unlocked = Math.max(save.unlocked, li + 2);
    writeSave();
    const last = li === LEVELS.length - 1;
    card(`<p class="eyebrow">Level ${li + 1} cleared</p><h2>${LEVELS[li].name}</h2>
      <dl class="stats">
        <dt>Time</dt><dd>${fmt(run.time)}</dd>
        <dt>Gems</dt><dd>${st.gems} of ${st.totalGems}</dd>
        <dt>Ruby</dt><dd>${st.totalRed ? (ruby ? 'Found' : 'Missed') : 'None here'}</dd>
        <dt>Deaths</dt><dd>${run.deaths}</dd>
      </dl>
      ${newBest && prev ? '<p class="tag">New best time</p>' : ''}
      <div class="btns">
        <button class="btn primary" id="cNext" data-primary type="button">${last ? 'Finish' : 'Next level'}</button>
        <button class="btn" id="cAgain" type="button">Play again</button>
        <button class="btn" id="cSel" type="button">Levels</button>
      </div>`);
    on('cNext', () => (last ? showDone() : startLevel(li + 1)));
    on('cAgain', () => startLevel(li));
    on('cSel', showSelect);
  }

  function showDone() {
    setMode('done');
    const bests = Object.values(save.best);
    const total = bests.reduce((a, b) => a + b.time, 0);
    const rubies = bests.filter((b) => b.ruby).length;
    const rubyLevels = LEVELS.filter((lv) => lv.map.some((r) => r.includes('R'))).length;
    card(`<p class="eyebrow">The temple is conquered</p><h2>You reached the Heart of the Temple</h2>
      <dl class="stats">
        <dt>Total best time</dt><dd>${fmt(total)}</dd>
        <dt>Rubies</dt><dd>${rubies} of ${rubyLevels}</dd>
      </dl>
      <p>${rubies < rubyLevels ? 'Some rubies are still hidden in the ruins. Go back and find them.' : 'Every ruby found. A true diamond hunter.'}</p>
      <div class="btns">
        <button class="btn primary" id="cSel" data-primary type="button">Levels</button>
        <button class="btn" id="cTitle" type="button">Title screen</button>
      </div>`);
    on('cSel', showSelect);
    on('cTitle', showTitle);
  }

  let toastTimer = 0;
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.hidden = false;
    t.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = '0'; setTimeout(() => { t.hidden = true; }, 300); }, 1600);
  }

  // ---------- HUD ----------
  const hudCache = {};
  function setText(id, v, cls) {
    if (hudCache[id] === v + (cls || '')) return;
    hudCache[id] = v + (cls || '');
    const el = $(id);
    el.textContent = v;
    if (cls !== undefined) el.className = cls;
  }
  function updateHud() {
    if (!st) return;
    const inLevel = mode !== 'title' && mode !== 'select';
    if (!inLevel) {
      setText('hGems', '-', 'dim'); setText('hKeys', '-', 'dim'); setText('hRuby', '-', 'dim');
      setText('hTime', '0:00'); setText('hDeaths', '0'); setText('hLevel', '');
      return;
    }
    setText('hGems', `${st.gems}/${st.need}`, st.gems >= st.need ? 'ok' : '');
    setText('hKeys', String(st.keys), st.keys ? '' : 'dim');
    setText('hRuby', `${st.red}/${st.totalRed}`, st.red >= st.totalRed ? 'ok' : '');
    setText('hTime', fmt(run.time));
    setText('hDeaths', String(run.deaths));
    setText('hLevel', `${li + 1}. ${LEVELS[li].name}`);
  }

  // ---------- Particles ----------
  function burst(x, y, color, n, speed = 1) {
    if (reduceMotion) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * speed;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.6, life: 26 + Math.random() * 14, color });
    }
  }

  function handleEvents() {
    const cx = st.px * TS + 8, cy = st.py * TS + 8;
    const seen = new Set();
    for (const e of st.events) {
      if (seen.has(e)) continue;
      seen.add(e);
      if (SFX[e]) SFX[e]();
      if (e === 'gem') burst(cx, cy, '#bdf6ff', 8);
      else if (e === 'red') { burst(cx, cy, '#ff9aa8', 14, 1.4); toast('Hidden ruby found'); }
      else if (e === 'key') burst(cx, cy, '#fff0a8', 8);
      else if (e === 'dig') burst(cx, cy, '#8a6238', 5, 0.6);
      else if (e === 'door') burst(cx, cy, '#e8b84a', 10);
      else if (e === 'land') { if (!reduceMotion) shake = Math.max(shake, 3); }
      else if (e === 'squash') { for (let i = 0; i < st.t.length; i++) if (st.t[i] === T.GEM && st.moved[i] && st.mv[i] < 0) burst((i % st.w) * TS + 8, Math.floor(i / st.w) * TS + 8, '#a888d0', 14, 1.3); }
      else if (e === 'check') { checkpoint = Engine.clone(st); burst(cx, cy, '#7ff0ff', 16, 1.2); toast('Checkpoint reached'); }
      else if (e === 'die') { run.deaths++; deathAt = performance.now(); setMode('dead'); burst(cx, cy, '#ef5a6c', 18, 1.5); }
      else if (e === 'win') { setTimeout(completeLevel, 450); setMode('won'); }
    }
  }

  // ---------- World update ----------
  function tickWorld() {
    if (mode === 'play') {
      const dir = held.length ? held[held.length - 1] : queued;
      queued = null;
      Engine.step(st, dir);
      handleEvents();
    } else if (mode === 'title' || mode === 'select') {
      Engine.step(st, null);
      st.events.length = 0;
    }
  }

  // ---------- Rendering ----------
  function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return (h ^ (h >>> 16)) >>> 0; }

  function entityPos(i, a) {
    const x = i % st.w, y = (i / st.w) | 0;
    const from = st.mv[i];
    if (from < 0 || a >= 1) return [x * TS, y * TS];
    const fx = from % st.w, fy = (from / st.w) | 0;
    return [(fx + (x - fx) * a) * TS, (fy + (y - fy) * a) * TS];
  }

  function render(now, a) {
    const W = st.w, H = st.h;
    // Camera follows the explorer, eased, clamped to the map
    const [ppx, ppy] = entityPos(st.py * W + st.px, a);
    const maxX = Math.max(0, W * TS - VW * TS), maxY = Math.max(0, H * TS - VH * TS);
    const tx = Math.min(maxX, Math.max(0, ppx + 8 - (VW * TS) / 2));
    const ty = Math.min(maxY, Math.max(0, ppy + 8 - (VH * TS) / 2));
    if (!cam.init) { cam.x = tx; cam.y = ty; cam.init = true; }
    cam.x += (tx - cam.x) * 0.18;
    cam.y += (ty - cam.y) * 0.18;
    let ox = Math.round(cam.x), oy = Math.round(cam.y);
    if (W * TS < VW * TS) ox = -Math.floor((VW * TS - W * TS) / 2);
    if (H * TS < VH * TS) oy = -Math.floor((VH * TS - H * TS) / 2);
    if (shake > 0) { ox += Math.round((Math.random() - 0.5) * shake); oy += Math.round((Math.random() - 0.5) * shake); shake *= 0.8; if (shake < 0.5) shake = 0; }

    ctx.fillStyle = '#050806';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const x0 = Math.max(0, Math.floor(ox / TS) - 1), x1 = Math.min(W - 1, Math.floor((ox + VW * TS) / TS) + 1);
    const y0 = Math.max(0, Math.floor(oy / TS) - 1), y1 = Math.min(H - 1, Math.floor((oy + VH * TS) / TS) + 1);
    const exitOpen = st.gems >= st.need;
    const frame = Math.floor(now / 220) % 2;

    // Pass 1: floor, walls, soil, doors, exits and floor overlays
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x, c = st.t[i], sx = x * TS - ox, sy = y * TS - oy, hsh = hash(x, y);
        if (c === T.WALL) { ctx.drawImage(SPR.wall[hsh % SPR.wall.length], sx, sy); continue; }
        ctx.drawImage(SPR.bg[hsh % SPR.bg.length], sx, sy);
        if (c === T.DIRT) ctx.drawImage(SPR.soil[hsh % SPR.soil.length], sx, sy);
        else if (c === T.DOOR) ctx.drawImage(SPR.door, sx, sy);
        else if (c === T.EXIT) {
          ctx.drawImage(exitOpen ? SPR.exitOpen : SPR.exitClosed, sx, sy);
          if (exitOpen) {
            ctx.globalAlpha = 0.25 + 0.2 * Math.sin(now / 180);
            ctx.fillStyle = '#ffe9a0';
            ctx.fillRect(sx - 2, sy - 2, TS + 4, TS + 4);
            ctx.globalAlpha = 1;
          }
        }
        const ov = st.ov[i];
        if (ov === OV.SPIKE) {
          const s = Engine.spikeUp(st, i) ? 'up' : Engine.spikeWarn(st, i) ? 'warn' : 'down';
          ctx.drawImage(SPR.spike[s], sx, sy);
        } else if (ov === OV.CHECK) {
          ctx.drawImage(SPR.check[st.cp[i] ? 1 : 0], sx, sy);
        }
      }
    }

    // Pass 2: things that move, at their in-between positions
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = y * W + x, c = st.t[i];
        let img = null;
        switch (c) {
          case T.BOULDER: img = SPR.boulder[0]; break;
          case T.GEM: img = SPR.gem[0]; break;
          case T.RED: img = SPR.ruby[0]; break;
          case T.KEY: img = SPR.key[0]; break;
          case T.BAT: img = (st.d[i] < 0 ? SPR.batL : SPR.bat)[frame]; break;
          case T.SPIDER: img = SPR.spider[frame]; break;
          default: break;
        }
        if (!img) continue;
        let [ex, ey] = entityPos(i, a);
        let bob = 0;
        if (c === T.KEY) bob = Math.round(Math.sin(now / 260 + x) * 1.5);
        // The boulder on the explorer's head shakes harder the longer it is held
        const strain = c === T.BOULDER && st.alive && i === (st.py - 1) * W + st.px ? st.hold / Engine.HOLD_TICKS : 0;
        if (strain > 0.15 && !reduceMotion) ex += Math.round((Math.random() - 0.5) * 4 * strain);
        ctx.drawImage(img, Math.round(ex - ox), Math.round(ey - oy) + bob);
        if (strain > 0.15) {
          ctx.globalAlpha = strain * (0.35 + 0.25 * Math.sin(now / (reduceMotion ? 300 : 60)));
          ctx.fillStyle = '#ef5a6c';
          ctx.fillRect(Math.round(ex - ox) + 2, Math.round(ey - oy) + 2, TS - 4, TS - 3);
          ctx.globalAlpha = 1;
        }
        if ((c === T.GEM || c === T.RED) && (hash(x, y) + Math.floor(now / 90)) % 23 === 0) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(Math.round(ex - ox) + 5, Math.round(ey - oy) + 5, 1, 1);
          ctx.fillRect(Math.round(ex - ox) + 4, Math.round(ey - oy) + 6, 3, 1);
          ctx.fillRect(Math.round(ex - ox) + 5, Math.round(ey - oy) + 7, 1, 1);
        }
      }
    }
    // The explorer is drawn last so falling things pass behind, and always even when dying
    {
      const i = st.py * W + st.px;
      const [ex, ey] = entityPos(i, a);
      const walking = st.mv[i] >= 0 && a < 1;
      const set = st.face < 0 ? SPR.playerL : SPR.player;
      const img = set[walking ? Math.floor(a * 2) % 2 : 0];
      if (!st.alive) {
        const t = deathAt ? Math.min(1, (now - deathAt) / 700) : 1;
        ctx.globalAlpha = 1 - t;
        ctx.drawImage(img, Math.round(ex - ox), Math.round(ey - oy - t * 10));
        ctx.globalAlpha = 1;
      } else {
        ctx.drawImage(img, Math.round(ex - ox), Math.round(ey - oy));
      }
    }

    // Particles
    for (const p of particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.min(1, p.life / 20);
      ctx.fillRect(Math.round(p.x - ox), Math.round(p.y - oy), 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  function stepParticles() {
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--; }
    particles = particles.filter((p) => p.life > 0);
  }

  // ---------- Main loop ----------
  function frame(now) {
    const dt = Math.min(250, now - (lastFrame || now));
    lastFrame = now;
    const ticking = mode === 'play' || mode === 'title' || mode === 'select';
    if (ticking) {
      acc += dt;
      if (mode === 'play') run.time += dt;
      while (acc >= TICK) {
        acc -= TICK;
        tickWorld();
        if (mode !== 'play' && mode !== 'title' && mode !== 'select') { acc = 0; break; }
      }
      // Attract world: restart the demo if a bat ever catches the idle explorer
      if ((mode === 'title' || mode === 'select') && !st.alive) startAttract();
    }
    if (mode === 'dead' && deathAt && now - deathAt > 750) { deathAt = 0; showDead(); }
    stepParticles();
    render(now, ticking ? acc / TICK : 1);
    updateHud();
    requestAnimationFrame(frame);
  }

  // ---------- Boot ----------
  function start(data) {
    if (data && typeof data.li === 'number' && data.mode === 'play' && LEVELS[data.li]) {
      startLevel(data.li, false);
      pauseGame();
    } else {
      showTitle();
    }
    requestAnimationFrame(frame);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ li, mode: mode === 'pause' || mode === 'play' ? 'play' : mode }));
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();

</script>
</body>
</html>
